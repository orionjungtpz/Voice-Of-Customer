name: Update Stock Data

on:
  schedule:
    - cron: '0 0,2,4,6 * * 1-5'   # 평일 09:00~15:00 KST (UTC+9) 1시간마다
  workflow_dispatch:                 # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch stock data
        run: |
          python3 - <<'EOF'
          import urllib.request, json, datetime, os

          url = "https://query1.finance.yahoo.com/v8/finance/chart/047050.KS?interval=1d&range=5d"
          req = urllib.request.Request(url, headers={
            "User-Agent": "Mozilla/5.0",
            "Accept": "application/json"
          })

          try:
            with urllib.request.urlopen(req, timeout=10) as res:
              data = json.loads(res.read())

            result = data["chart"]["result"][0]
            meta   = result["meta"]
            quote  = result["indicators"]["quote"][0]
            ts     = result.get("timestamp", [])

            closes  = [x for x in quote.get("close",  []) if x is not None]
            highs   = [x for x in quote.get("high",   []) if x is not None]
            lows    = [x for x in quote.get("low",    []) if x is not None]
            volumes = [x for x in quote.get("volume", []) if x is not None]

            price  = round(closes[-1])
            prev   = round(closes[-2]) if len(closes) >= 2 else round(meta.get("chartPreviousClose", price))
            change = price - prev
            pct    = round(change / prev * 100, 2)

            now_kst = datetime.datetime.utcnow() + datetime.timedelta(hours=9)

            stock = {
              "price":       price,
              "change":      change,
              "changePct":   str(abs(pct)),
              "high":        round(highs[-1]),
              "low":         round(lows[-1]),
              "volume":      int(volumes[-1]),
              "updatedAt":   now_kst.strftime("%m/%d %H:%M"),
              "marketState": meta.get("marketState", "CLOSED")
            }
          except Exception as e:
            print(f"Error: {e}")
            # 기존 파일 유지 (실패 시 덮어쓰지 않음)
            import sys
            sys.exit(0)

          os.makedirs("data", exist_ok=True)
          with open("data/stock.json", "w") as f:
            json.dump(stock, f, ensure_ascii=False)

          print(f"✅ Updated: {stock}")
          EOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stock.json
          git diff --staged --quiet || git commit -m "chore: update stock data [skip ci]"
          git push
